name: "Release Heliox OS"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to validate (for example v0.11.0)"
        type: string
        required: true
      build_installers:
        description: "Build installers and publish the release after every gate passes"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish the already-validated daemon distribution to PyPI"
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

# Windows release signing through the SignPath Foundation (docs/WINDOWS_SIGNING.md, "Production cutover"). Off until
# the owner confirms that SignPath has issued the Foundation certificate and the release-signing policy is valid:
# then set the repository variable WINDOWS_RELEASE_SIGNING to "signpath". While it is on, the Windows installers are
# built without being attached, signed by SignPath with the release-signing policy, verified as trusted, and only the
# signed pair is attached; anything short of that stops the release, with no fallback to unsigned installers.
# While it is off (unset, or any other value), releases attach unsigned Windows installers as before.

jobs:
  release-gate:
    name: Verify release metadata, CI, and daemon package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify synchronized version and tag
        id: version
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${DISPATCH_RELEASE_TAG}"
          fi
          python scripts/check_release.py --tag "$tag"
          version="$(python -c "import tomllib; print(tomllib.load(open('daemon/pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          required_checks=(
            "Svelte (Prettier + Build)"
            "Visual Regression (ubuntu-latest)"
            "Visual Regression (windows-latest)"
            "Visual Regression (macos-latest)"
            "Rust (Clippy + Fmt)"
            "Python (Ruff + Pytest) (ubuntu-latest, 3.11)"
            "Python (Ruff + Pytest) (ubuntu-latest, 3.12)"
            "Python (Ruff + Pytest) (windows-latest, 3.11)"
            "Python (Ruff + Pytest) (windows-latest, 3.12)"
            "Python (Ruff + Pytest) (macos-latest, 3.11)"
            "Python (Ruff + Pytest) (macos-latest, 3.12)"
          )
          release_sha="${{ steps.version.outputs.commit_sha }}"
          checks_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/check-runs?per_page=100")"
          for check_name in "${required_checks[@]}"; do
            conclusion="$(jq -r --arg name "$check_name" \
              '.check_runs[] | select(.name == $name) | .conclusion' \
              <<<"$checks_json" | head -n 1)"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required check '$check_name' is '$conclusion' for ${release_sha}."
              exit 1
            fi
          done

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check build twine

      - name: Build and validate daemon distributions
        working-directory: daemon
        run: |
          python -m build
          python -m twine check dist/*
          python ../scripts/check_daemon_artifact.py dist/*.whl

      - name: Upload validated daemon distributions
        uses: actions/upload-artifact@v4
        with:
          name: pilot-daemon-${{ steps.version.outputs.version }}
          path: daemon/dist/*
          if-no-files-found: error
          retention-days: 14

  publish-daemon-to-pypi:
    name: Publish validated daemon to PyPI
    needs: release-gate
    if: github.event_name == 'push' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated daemon distributions
        uses: actions/download-artifact@v8
        with:
          name: pilot-daemon-${{ needs.release-gate.outputs.version }}
          path: dist

      - name: Check whether this version is already on PyPI
        id: pypi
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        shell: bash
        run: |
          if curl --fail --silent --show-error \
            "https://pypi.org/pypi/pilot-daemon/${VERSION}/json" > /dev/null; then
            echo "pilot-daemon ${VERSION} is already on PyPI; publication is idempotent."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.pypi.outputs.already_published != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine upload --verbose dist/*

  build-tauri:
    name: Build ${{ matrix.label }} installer
    needs: release-gate
    if: github.event_name == 'push' || inputs.build_installers == true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            label: "Windows"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            label: "macOS-ARM"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            label: "macOS-Intel"
          - platform: "ubuntu-22.04"
            args: ""
            label: "Linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            tauri-app/ui/package-lock.json
            tauri-app/package-lock.json

      - name: Install frontend dependencies reproducibly
        working-directory: tauri-app/ui
        run: npm ci

      - name: Install the Tauri CLI pinned in tauri-app's lock file
        working-directory: tauri-app
        run: npm ci

      - name: Prefetch verified WiX toolset
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $wixTools = Join-Path $env:LOCALAPPDATA "tauri\WixTools314"
          $expectedSha256 = "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download wix3141rtm `
              --repo wixtoolset/wix3 `
              --pattern wix314-binaries.zip `
              --dir $env:RUNNER_TEMP `
              --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "Could not download WiX after $attempt attempts." }
            Start-Sleep -Seconds (5 * $attempt)
          }

          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "WiX archive checksum mismatch: $actualSha256"
          }
          New-Item -ItemType Directory -Path $wixTools -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $wixTools -Force
          foreach ($tool in @("candle.exe", "light.exe", "WixUIExtension.dll", "WixUtilExtension.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $wixTools $tool))) {
              throw "Verified WiX archive is missing $tool."
            }
          }

      - name: Build and stage release artifacts
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "tauri-app"
          # With Windows release signing on, the Windows leg builds without a tag, so tauri-action attaches nothing:
          # the sign-windows job attaches the signed pair. Every other leg, and Windows with signing off, attach.
          tagName: >-
            ${{ !(matrix.platform == 'windows-latest' && vars.WINDOWS_RELEASE_SIGNING == 'signpath')
            && (github.event_name == 'push' && github.ref_name || inputs.release_tag) || '' }}
          releaseName: "Heliox OS v${{ needs.release-gate.outputs.version }}"
          releaseBody: |
            ## Heliox OS v${{ needs.release-gate.outputs.version }}

            Release artifacts are being built and verified. This temporary
            staging release is published only after PyPI and every platform
            installer pass their release gates.

            Python 3.11+ is required. The desktop app creates its private
            environment on first launch.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Verify Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem `
            -Path tauri-app/src-tauri/target/release/bundle `
            -Recurse -File -Include *.exe,*.msi
          if (-not $artifacts) {
            throw "No Windows installer artifacts were produced."
          }

      - name: Stage the unsigned Windows pair for SignPath (Windows release signing on)
        if: matrix.platform == 'windows-latest' && vars.WINDOWS_RELEASE_SIGNING == 'signpath'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "tauri-app/src-tauri/target/release/bundle"
          $stage = Join-Path $env:RUNNER_TEMP "signpath-unsigned"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $installers = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          $exe = @($installers | Where-Object Extension -EQ ".exe")
          $msi = @($installers | Where-Object Extension -EQ ".msi")
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one EXE and one MSI to sign; found $($exe.Count) EXE and $($msi.Count) MSI."
          }
          Copy-Item -LiteralPath $exe[0].FullName -Destination $stage
          Copy-Item -LiteralPath $msi[0].FullName -Destination $stage

      - name: Keep the unsigned Windows pair for the signing job (never attached to the release)
        if: matrix.platform == 'windows-latest' && vars.WINDOWS_RELEASE_SIGNING == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: heliox-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-unsigned/*
          if-no-files-found: error
          retention-days: 1

      - name: Verify macOS artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_count="$(find tauri-app/src-tauri/target -name '*.app' | wc -l | tr -d ' ')"
          dmg_count="$(find tauri-app/src-tauri/target -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$app_count" == "0" || "$dmg_count" == "0" ]]; then
            echo "::error::Expected macOS app and DMG artifacts were not produced."
            exit 1
          fi

      - name: Verify Linux package structures
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          bundle_dir="tauri-app/src-tauri/target/release/bundle"
          test -n "$(find "$bundle_dir" -name '*.AppImage' -print -quit)"
          deb="$(find "$bundle_dir" -name '*.deb' -print -quit)"
          rpm="$(find "$bundle_dir" -name '*.rpm' -print -quit)"
          test -n "$deb"
          test -n "$rpm"
          dpkg-deb --info "$deb" > /dev/null
          file "$rpm" | grep -q 'RPM'

  sign-windows:
    name: Sign the Windows installers with SignPath and attach only the signed pair
    needs: build-tauri
    if: vars.WINDOWS_RELEASE_SIGNING == 'signpath' && needs.build-tauri.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      # The subject the trusted signature must carry: the SignPath Foundation's code-signing certificate.
      EXPECTED_SIGNER: "SignPath Foundation"
    steps:
      - name: The signing job's inputs are there
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
            throw "Windows release signing is on, but the repository secret SIGNPATH_API_TOKEN is empty, so nothing can be sent to SignPath. The release stops here; no Windows installer was attached."
          }
          if (-not $env:RELEASE_TAG) { throw "No release tag to attach the signed installers to." }
          Write-Host "Signing the Windows installers of $env:RELEASE_TAG with SignPath's release-signing policy."

      - name: Fetch the unsigned pair from the Windows build
        uses: actions/download-artifact@v5
        with:
          name: heliox-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-unsigned

      - name: Hand the unsigned pair to SignPath as an artifact of this job
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: heliox-windows-for-signpath-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-unsigned/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign with the SignPath Foundation release certificate
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 15be8529-09d1-4159-a99c-00e90c0d6c65
          project-slug: Heliox-OS
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Say why the release stopped, when SignPath did not sign
        shell: pwsh
        if: failure() && steps.signpath.outcome == 'failure'
        run: |
          Write-Host "::error::SignPath did not sign the Windows installers with Heliox's release certificate, so none was attached and this release is not published. The release-signing policy can only sign once SignPath has finished its review and issued the Foundation certificate; the SignPath request named in the step above says which it is. Nothing unsigned is attached in its place."
          exit 1

      - name: Verify a trusted signature on both installers and the application inside
        shell: pwsh
        run: |
          $signedRoot = Join-Path $env:RUNNER_TEMP "signpath-signed"
          $installers = @(Get-ChildItem -Path $signedRoot -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") })
          $exe = @($installers | Where-Object Extension -EQ ".exe")
          $msi = @($installers | Where-Object Extension -EQ ".msi")
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) {
            throw "SignPath returned $($exe.Count) EXE and $($msi.Count) MSI instead of one of each; nothing was attached."
          }

          function Assert-Trusted([string] $path, [string] $what) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            $subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { "(no signer)" }
            if ($signature.Status -ne "Valid") {
              throw "Windows does not trust the signature on $what ($([IO.Path]::GetFileName($path))): status $($signature.Status), signer $subject. A missing, self-signed or untrusted signature stops the release; nothing was attached."
            }
            if ($subject -notlike "*$env:EXPECTED_SIGNER*") {
              throw "$what is signed by $subject, not by $env:EXPECTED_SIGNER; the release stops and nothing was attached."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "$what has no timestamp, so its signature would stop being valid when the certificate expires; the release stops and nothing was attached."
            }
            Write-Host "$what ($([IO.Path]::GetFileName($path))): Valid, signed by $subject, timestamped by $($signature.TimeStamperCertificate.Subject)"
          }

          Assert-Trusted $exe[0].FullName "the setup program"
          Assert-Trusted $msi[0].FullName "the MSI package"

          # The application inside the MSI, which SignPath's windows-installers configuration signs as a third layer.
          $extracted = Join-Path $env:RUNNER_TEMP "msi-contents"
          $process = Start-Process msiexec.exe -ArgumentList @("/a", "`"$($msi[0].FullName)`"", "/qn", "TARGETDIR=`"$extracted`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Could not unpack the MSI to check the application inside (msiexec exit $($process.ExitCode))." }
          $inner = @(Get-ChildItem -Path $extracted -Recurse -File -Filter *.exe)
          if ($inner.Count -eq 0) { throw "The MSI holds no executable to check; nothing was attached." }
          foreach ($program in $inner) { Assert-Trusted $program.FullName "the application inside the MSI" }

          # The application inside the setup program: reported, not required. SignPath's windows-installers
          # configuration signs the setup program itself, not the files NSIS packs inside it.
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (Test-Path -LiteralPath $sevenZip) {
            $unpacked = Join-Path $env:RUNNER_TEMP "setup-contents"
            & $sevenZip x $exe[0].FullName "-o$unpacked" -y | Out-Null
            foreach ($program in @(Get-ChildItem -Path $unpacked -Recurse -File -Filter *.exe)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $program.FullName
              if ($signature.Status -ne "Valid") {
                Write-Host "::warning::The application inside the setup program ($($program.Name)) is not signed ($($signature.Status)); only the setup program around it is."
              } else {
                Write-Host "Inside the setup program: $($program.Name) Valid, signed by $($signature.SignerCertificate.Subject)"
              }
            }
          }

      - name: Attach only the signed pair to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafts are listed only to a token that can write to the repository; this job's can.
          $releaseId = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
            --jq '.[] | select(.tag_name == $ENV.RELEASE_TAG) | .id' | Select-Object -First 1
          if (-not $releaseId) { throw "No staged release exists for $env:RELEASE_TAG; the signed installers were not attached." }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          $already = @($release.assets | Where-Object { $_.name -match '\.(exe|msi)$' })
          if ($already.Count -gt 0) {
            throw "The release already holds Windows installers ($(($already | ForEach-Object name) -join ', ')), which this job did not attach; they may be unsigned. The release stops; remove them before running again."
          }
          $signedRoot = Join-Path $env:RUNNER_TEMP "signpath-signed"
          $signed = @(Get-ChildItem -Path $signedRoot -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") })
          foreach ($file in $signed) {
            $url = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($file.Name))"
            gh api --method POST $url -H "Content-Type: application/octet-stream" --input $file.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not attach $($file.Name)." }
            Write-Host "Attached the signed $($file.Name) ($($file.Length) bytes)."
          }
          $after = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" | ConvertFrom-Json
          foreach ($file in $signed) {
            $asset = @($after.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -ne 1 -or $asset[0].size -ne $file.Length) {
              throw "The release does not hold exactly the signed $($file.Name) after attaching it."
            }
          }

  publish-release:
    name: Verify assets and publish stable release
    needs:
      - release-gate
      - publish-daemon-to-pypi
      - build-tauri
      - sign-windows
    # With Windows release signing on, publication waits for the signed pair; off, the signing job is skipped.
    if: >-
      always() &&
      needs.release-gate.result == 'success' &&
      needs.publish-daemon-to-pypi.result == 'success' &&
      needs.build-tauri.result == 'success' &&
      (needs.sign-windows.result == 'success' ||
        (vars.WINDOWS_RELEASE_SIGNING != 'signpath' && needs.sign-windows.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Verify complete installer set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        shell: bash
        run: |
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" | jq -s 'add')"
          release="$(jq --arg tag "$RELEASE_TAG" \
            'map(select(.tag_name == $tag)) | first' <<<"$releases")"
          release_id="$(jq -r '.id // empty' <<<"$release")"
          if [[ -z "$release_id" ]]; then
            echo "::error::No staged release exists for ${RELEASE_TAG}."
            exit 1
          fi

          asset_names="$(jq -r '.assets[].name' <<<"$release")"
          require_assets() {
            local pattern="$1"
            local minimum="$2"
            local count
            count="$(grep -Ec "$pattern" <<<"$asset_names" || true)"
            if (( count < minimum )); then
              echo "::error::Expected at least ${minimum} release asset(s) matching ${pattern}; found ${count}."
              exit 1
            fi
          }
          require_assets '\.exe$' 1
          require_assets '\.msi$' 1
          require_assets '\.dmg$' 2
          require_assets '\.app\.tar\.gz$' 2
          require_assets '\.AppImage$' 1
          require_assets '\.deb$' 1
          require_assets '\.rpm$' 1

          release_notes="$(cat "docs/releases/${RELEASE_TAG}.md")"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f name="Heliox OS ${RELEASE_TAG}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --raw-field body="$release_notes" > /dev/null

          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e '.draft == false and .prerelease == false' <<<"$published" > /dev/null
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::Published ${RELEASE_TAG}, but GitHub still reports ${latest_tag} as latest."
            exit 1
          fi
          echo "Published ${RELEASE_TAG} with $(jq '.assets | length' <<<"$published") assets."
