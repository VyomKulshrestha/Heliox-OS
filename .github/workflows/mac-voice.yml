name: "A spoken turn on macOS (virtual microphone)"

# A synthetic voice says the wake phrase and a request into BlackHole 2ch, a loopback audio driver, and Heliox's own
# listener hears it through its real macOS capture path (PortAudio on Core Audio), decides the wake and recognises
# the request with Faster-Whisper tiny.en on the CPU; a second sentence without the wake phrase must not be taken
# (daemon/tests/platform_real/mac_voice_check.py). The driver is installed and coreaudiod restarted on this runner
# only. Manual and nightly, never on every push.

on:
  workflow_dispatch:
  schedule:
    - cron: "11 3 * * *" # nightly, 03:11 UTC

permissions:
  contents: read

concurrency:
  group: mac-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-voice:
    name: A spoken turn on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The job's own set-up, tried first in its cheapest form, so the first run reaches the audio: two new
      # workflows' first runs died in their set-up on 13 November (this one ran pip from inside daemon/, where
      # ./daemon does not exist). Every path the job names, the pip install as a dry run, the two Homebrew packages
      # known to Homebrew, and the system's say. Nothing is installed here.
      - name: The job's inputs are there (a minute, before anything is installed)
        timeout-minutes: 4
        run: |
          # The same fake home as the steps after it: pip's dry run writes its cache under HOME, and nothing here
          # may touch the runner's own (test_ci_fake_home.py reads every step that names the check).
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          failed=0
          for path in daemon/pyproject.toml daemon/tests/platform_real/mac_voice_check.py daemon/tests/platform_real/ci_only.py; do
            if [ -f "$path" ]; then
              echo "CHECK job-inputs/path: PASS - $path"
            else
              echo "CHECK job-inputs/path: FAIL - $path is missing"
              failed=$((failed + 1))
            fi
          done
          if python -m pip install --disable-pip-version-check --dry-run -q -e ./daemon faster-whisper sounddevice soundfile soundcard \
            > "$RUNNER_TEMP/pip-dry-run.log" 2>&1; then
            echo "CHECK job-inputs/pip: PASS - the daemon, faster-whisper, sounddevice, soundfile and soundcard would install"
          else
            echo "CHECK job-inputs/pip: FAIL - $(tail -3 "$RUNNER_TEMP/pip-dry-run.log" | tr '\n' ' ')"
            failed=$((failed + 1))
          fi
          for package in "--cask blackhole-2ch" "espeak-ng" "switchaudio-osx"; do
            # shellcheck disable=SC2086 # "--cask blackhole-2ch" is two arguments on purpose
            if brew info $package > /dev/null 2>&1; then
              echo "CHECK job-inputs/brew: PASS - Homebrew knows $package"
            else
              echo "CHECK job-inputs/brew: FAIL - Homebrew does not know $package"
              failed=$((failed + 1))
            fi
          done
          if command -v say > /dev/null; then
            echo "CHECK job-inputs/say: PASS - $(command -v say)"
          else
            echo "CHECK job-inputs/say: FAIL - no say on this runner"
            failed=$((failed + 1))
          fi
          exit $failed

      - name: Install the daemon and the recogniser (core, Faster-Whisper, PortAudio)
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off -e ./daemon faster-whisper sounddevice soundfile soundcard
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          python -c "from huggingface_hub import snapshot_download; from pilot.system.model_presence import FASTER_WHISPER_REPOS as R; print(snapshot_download(R['tiny.en']))"

      # BlackHole 2ch (Existential Audio, GPL-3.0): a Core Audio plug-in in /Library/Audio/Plug-Ins/HAL, loaded when
      # coreaudiod starts, so coreaudiod is restarted after the install. espeak-ng (GPL-3.0) is the voice when this
      # runner's say writes silence. switchaudio-osx (MIT) sets the system default output for the measurement below.
      - name: Install the virtual audio device and restart Core Audio (this runner only)
        timeout-minutes: 5
        run: |
          brew install --cask blackhole-2ch
          brew install espeak-ng switchaudio-osx
          sudo killall coreaudiod || true
          sleep 5
          ls -l /Library/Audio/Plug-Ins/HAL/ || true

      - name: A spoken turn through Heliox's listener
        timeout-minutes: 5
        working-directory: daemon
        run: |
          export HOME="$RUNNER_TEMP/home"
          python tests/platform_real/mac_voice_check.py "$RUNNER_TEMP"

      # A measurement, not a pass mark (round 3): Heliox's listener on BlackHole while Heliox speaks one sentence
      # through its own voice paths, first with BlackHole as the system default output (microphone and speaker one
      # device, as with a USB headset), then with the runner's own output as the control. The check reads the
      # default output first and puts it back; it always exits 0, so these lines never fail the job.
      - name: "Measurement: Heliox speaking on the device it listens on (round 4, never fails the job)"
        if: always()
        timeout-minutes: 12
        working-directory: daemon
        run: |
          export HOME="$RUNNER_TEMP/home"
          python tests/platform_real/mac_voice_check.py "$RUNNER_TEMP" --speak-through blackhole || true
          python tests/platform_real/mac_voice_check.py "$RUNNER_TEMP" --speak-through default || true
