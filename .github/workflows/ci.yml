name: "CI — Lint & Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Python Linting & Tests ──
  python:
    name: Python (Ruff + Pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[full,dev]" || pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check . --output-format=github --no-cache

      - name: Ruff format check
        run: ruff format --check . --no-cache

      - name: Run tests
        run: pip install pytest-timeout && pytest tests/ -v --tb=short --timeout=300

  # ── Frontend Linting ──
  frontend:
    name: Svelte (Prettier + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-app/ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Install dependencies
        run: |
          success=false
          for i in {1..3}; do
            if npm ci || npm install; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Installation failed after 3 attempts"
            exit 1
          fi

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{svelte,ts,js,css}" "vite.config.ts"

      - name: Svelte check (type checking)
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Static frontend checks
        run: npm run test:static

      - name: Frontend unit tests
        run: npm run test:unit -- --run

      - name: Build check
        run: npx vite build

  approval-regression:
    name: Same-WebSocket Approval Regression
    # Pinned: ubuntu-latest moved to 26.04, where this Playwright release cannot install Chromium.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: daemon/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Install controlled smoke dependencies
        run: |
          python -m pip install -e "./daemon[browser]"
          npm ci --prefix tauri-app/ui
          npm exec --prefix tauri-app/ui -- playwright install --with-deps chromium
          python -m playwright install chromium

      - name: Run deterministic approval-to-navigation regression
        working-directory: tauri-app/ui
        run: npm run test:e2e:approval -- --reporter=github
        env:
          CI: "true"

      - name: Upload approval evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: approval-regression-evidence
          path: tauri-app/ui/test-results/
          retention-days: 7

  # ── Visual Regression Tests ──
  visual-regression:
    name: Visual Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the image the Linux baselines were rendered on; ubuntu-latest (26.04) has no Playwright Chromium.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: tauri-app/ui
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Install dependencies
        run: |
          success=false
          for i in {1..3}; do
            if npm ci || npm install; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Installation failed after 3 attempts"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check if baselines exist for this OS
        id: check_baselines
        run: |
          # Playwright appends the OS name to snapshots (e.g. -linux.png, -win32.png, -darwin.png)
          OS_SUFFIX="linux"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then OS_SUFFIX="win32"; fi
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then OS_SUFFIX="darwin"; fi
          echo "os_suffix=$OS_SUFFIX" >> $GITHUB_OUTPUT
          
          SNAPSHOT_DIR="tests/visual/__snapshots__"
          if [ -n "$(find $SNAPSHOT_DIR -name "*${OS_SUFFIX}.png" 2>/dev/null | head -1)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate missing baseline snapshots
        if: steps.check_baselines.outputs.exists == 'false'
        run: npx playwright test --update-snapshots --reporter=github
        env:
          CI: "true"

      - name: Upload generated baselines for review
        if: steps.check_baselines.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-${{ matrix.os }}
          path: tauri-app/ui/tests/visual/__snapshots__/**/*-chromium-${{ steps.check_baselines.outputs.os_suffix }}.png
          if-no-files-found: error
          retention-days: 7

      - name: Run visual regression tests (comparison)
        run: npx playwright test --reporter=github
        env:
          CI: "true"

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs-${{ matrix.os }}
          path: tauri-app/ui/test-results/
          retention-days: 7

  # ── Rust Linting ──
  rust:
    name: Rust (Clippy + Fmt)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      # Build frontend first (Tauri needs it)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Build frontend
        working-directory: tauri-app/ui
        run: |
          success=false
          for i in {1..3}; do
            if npm ci || npm install; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Installation failed after 3 attempts"
            exit 1
          fi
          npx vite build

      - name: Cargo fmt check
        working-directory: tauri-app/src-tauri
        run: cargo fmt -- --check

      - name: Cargo clippy
        working-directory: tauri-app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests
        working-directory: tauri-app/src-tauri
        run: cargo test --all-targets

  # ── Real platform readers (experimental, non-blocking) ──
  # Exercises the macOS and Linux focused-text readers against real accessibility stacks on hosted runners.
  # The unit tests for the same code run in the `python` job on every system. This job is allowed to fail while
  # the runner setups are being proved; make it required once it has passed on three consecutive pushes to main.
  platform-readers:
    name: Platform readers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        working-directory: daemon
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the daemon with its platform extra
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then pip install -e ".[linux]"; else pip install -e ".[macos]"; fi
          pip list 2>/dev/null | grep -iE "jeepney|pyobjc-framework-(ApplicationServices|Cocoa|Quartz)" || true

      - name: Install the Linux accessibility stack (AT-SPI, GTK 3, Xvfb, xdotool)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xdotool dbus dbus-x11 at-spi2-core libatk-adaptor \
            python3-gi gir1.2-gtk-3.0
          ls /usr/share/dbus-1/services/ | grep -i a11y || echo "no org.a11y.Bus service file"

      - name: Linux, quiet in calls - another app recording is seen through PulseAudio
        if: runner.os == 'Linux'
        # Its own failure must not stop the accessibility checks below.
        continue-on-error: true
        run: |
          pip install pytest pytest-asyncio pytest-timeout sounddevice soundcard
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils libportaudio2 libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-source source_name=heliox_mic
          pactl load-module module-null-source source_name=heliox_headset
          pactl set-default-source heliox_headset
          HELIOX_REAL_PULSE=1 pytest tests/test_call_detection_mac_linux.py tests/test_audio_health.py -q --timeout=120 \
            -k "real"

      - name: Linux, X11 session - type into a GTK field and read it through AT-SPI
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
            export DISPLAY=:99 GTK_A11Y=atspi
            sleep 2
            python tests/platform_real/linux_atspi_check.py --python /usr/bin/python3
            reader=$?
            # Live end to end: a slip typed into the GTK field becomes a card; excluded app, password field, closed
            # window.
            python tests/platform_real/live_end_to_end_check.py --python /usr/bin/python3
            exit $(( reader + $? ))
          '

      # Weston's headless backend has no seat, so nothing can take keyboard focus there (first run: GTK logged
      # gdk_seat_get_keyboard assertions and no element was ever focused). Sway on wlroots' headless backend
      # always has a seat, focuses new windows, and accepts keys from wtype through the virtual-keyboard protocol.
      - name: Linux, Wayland session (sway headless) - the same checks without X
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y -q --no-install-recommends sway wtype
          dbus-run-session -- bash -c '
            export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
            printf "output HEADLESS-1 resolution 1280x800\n" > /tmp/sway.conf
            WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /tmp/sway.conf >/tmp/sway.log 2>&1 &
            sock=""
            for i in $(seq 1 50); do
              sock=$(ls "$XDG_RUNTIME_DIR" | grep -E "^wayland-[0-9]+$" | head -1)
              [ -n "$sock" ] && break
              sleep 0.2
            done
            echo "sway socket: ${sock:-none}"
            unset DISPLAY
            export WAYLAND_DISPLAY=$sock GDK_BACKEND=wayland
            python tests/platform_real/linux_atspi_check.py --wayland --python /usr/bin/python3
            status=$?
            python tests/platform_real/live_end_to_end_check.py --wayland --python /usr/bin/python3
            status=$(( status + $? ))
            tail -20 /tmp/sway.log
            exit $status
          '

      # Screenshots on Wayland go through the desktop's portal. Under sway, xdg-desktop-portal-wlr answers without a
      # dialog, so this proves Heliox's client end to end; GNOME's and KDE's consent dialogs are not proven here.
      # GlobalShortcuts is not in xdg-desktop-portal-wlr: the client is checked against a fake portal on its own bus.
      - name: Linux, Wayland portals (Screenshot under sway, GlobalShortcuts against a fake portal)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y -q --no-install-recommends sway xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk pipewire
          mkdir -p "$HOME/.config/xdg-desktop-portal"
          printf "[preferred]\ndefault=wlr;gtk\norg.freedesktop.impl.portal.Screenshot=wlr\norg.freedesktop.impl.portal.Access=gtk\n" > "$HOME/.config/xdg-desktop-portal/sway-portals.conf"
          ls /usr/share/xdg-desktop-portal/portals/ /usr/share/dbus-1/services/ | grep -i portal || true
          dbus-run-session -- bash -c '
            export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
            export XDG_CURRENT_DESKTOP=sway
            printf "output HEADLESS-1 resolution 1280x800\n" > /tmp/sway-portal.conf
            WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /tmp/sway-portal.conf >/tmp/sway-portal.log 2>&1 &
            sock=""
            for i in $(seq 1 50); do
              sock=$(ls "$XDG_RUNTIME_DIR" | grep -E "^wayland-[0-9]+$" | head -1)
              [ -n "$sock" ] && break
              sleep 0.2
            done
            unset DISPLAY
            export WAYLAND_DISPLAY=$sock
            dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR
            # No systemd user session on the runner: start PipeWire, the wlr backend and the portal here, in that
            # order, with their logs. The backend initialises screen casting at start and exits when it cannot reach
            # PipeWire (CI, 12 November: "pipewire could not connect to context"), taking Screenshot with it; the
            # front end only uses backends that are on the bus when it starts.
            pipewire >/tmp/pipewire.log 2>&1 &
            sleep 1
            /usr/libexec/xdg-desktop-portal-wlr -l DEBUG >/tmp/xdpw.log 2>&1 &
            # The front end exports Screenshot only when some backend implements Access (the consent dialog);
            # xdg-desktop-portal-gtk does. It must be on the bus before the front end starts.
            GDK_BACKEND=wayland /usr/libexec/xdg-desktop-portal-gtk >/tmp/xdpg.log 2>&1 &
            xdpw=$!
            sleep 1
            if kill -0 $xdpw 2>/dev/null; then echo "xdg-desktop-portal-wlr is running"; else wait $xdpw; echo "xdg-desktop-portal-wlr exited with status $?"; fi
            /usr/libexec/xdg-desktop-portal -v -r >/tmp/xdp.log 2>&1 &
            sleep 2
            python tests/platform_real/linux_portal_check.py real
            status=$?
            if [ $status -ne 0 ]; then
              echo "--- xdg-desktop-portal log"; tail -40 /tmp/xdp.log
              echo "--- xdg-desktop-portal-wlr log"; tail -40 /tmp/xdpw.log
              echo "--- pipewire log"; tail -20 /tmp/pipewire.log
              echo "--- xdg-desktop-portal-gtk log"; tail -20 /tmp/xdpg.log
              kill -0 $xdpw 2>/dev/null && echo "xdg-desktop-portal-wlr still running" || echo "xdg-desktop-portal-wlr not running"
            fi
            exit $status
          '
          real=$?
          dbus-run-session -- python tests/platform_real/linux_portal_check.py fake
          fake=$?
          exit $(( real + fake ))

      - name: macOS - permissions, frontmost app and the Accessibility reader
        if: runner.os == 'macOS'
        run: |
          sw_vers
          python tests/platform_real/macos_ax_check.py
          reader=$?
          python tests/platform_real/live_end_to_end_check.py
          exit $(( reader + $? ))

      - name: Live terminal check in real zsh and fish sessions
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -q --no-install-recommends zsh fish netcat-openbsd
          else
            brew install fish >/dev/null
          fi
          zsh --version; fish --version
          python tests/platform_real/shell_integration_check.py

      - name: Unit tests for the readers on this runner
        run: |
          pip install pytest pytest-asyncio pytest-timeout
          pytest tests/test_platform_readers.py tests/test_platform_quiet_failures.py tests/test_live_shell_line.py -q --timeout=120

  # ── First run from nothing (experimental, non-blocking) ──
  # Runs the app's own first-run script (tauri-app/src-tauri/setup) in an empty home folder with the core only
  # (plus the platform readers on macOS and Linux), starts the daemon it installed and checks that it answers its
  # RPC. "private" proves the path for a machine without Python 3.11+ (uv and a private Python); "auto" uses the
  # runner's Python. The daemon comes from this checkout, as the released version may not be on PyPI yet.
  first-run:
    name: First run (${{ matrix.os }}, ${{ matrix.python }} Python)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: [auto, private]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Run the first-run script in an empty home folder
        env:
          HELIOX_PYTHON: ${{ matrix.python }}
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export HELIOX_SETUP_DIR="$HOME/.config/heliox-os"
          export HELIOX_CORE_REQ="$GITHUB_WORKSPACE/daemon"
          # Download sizes for the first-run screen: pip's cache starts empty and the script reports it after each step.
          export PIP_CACHE_DIR="$RUNNER_TEMP/pip-cache" HELIOX_MEASURE_PIP_CACHE="$RUNNER_TEMP/pip-cache"
          # The Python range the app passes to the script (setup.rs reads the same file).
          V=tauri-app/src-tauri/setup/python-versions.json
          export HELIOX_PYTHON_MIN="$(sed -n 's/.*"min": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_MAX="$(sed -n 's/.*"max": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_PRIVATE="$(sed -n 's/.*"private": *"\([0-9.]*\)".*/\1/p' $V)"
          echo "Python range ${HELIOX_PYTHON_MIN} to ${HELIOX_PYTHON_MAX}, private ${HELIOX_PYTHON_PRIVATE}"
          mkdir -p "$PIP_CACHE_DIR"
          case "$RUNNER_OS" in
            Linux) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[linux]" ;;
            macOS) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[macos]" ;;
            *) export HELIOX_GROUPS="" ;;
          esac
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Windows" ]; then
            export HELIOX_SETUP_DIR="$(cygpath -w "$HELIOX_SETUP_DIR")" HELIOX_CORE_REQ="$(cygpath -w "$HELIOX_CORE_REQ")"
            powershell -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/setup/first-run.ps1 probe
            powershell -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/setup/first-run.ps1 run | tee "$RUNNER_TEMP/setup.log"
          else
            sh tauri-app/src-tauri/setup/first-run.sh probe
            sh tauri-app/src-tauri/setup/first-run.sh run | tee "$RUNNER_TEMP/setup.log"
          fi
          status=${PIPESTATUS[0]}
          echo "setup exit code $status after $(( $(date +%s) - start )) s"
          grep "^@@" "$RUNNER_TEMP/setup.log"
          du -sh "$HOME/.config/heliox-os"/* 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$HOME/.config/heliox-os/env/Scripts/python.exe"; else PY="$HOME/.config/heliox-os/env/bin/python"; fi
          echo "FIRST_RUN_SIZES $RUNNER_OS ${{ matrix.python }} $("$PY" daemon/tests/platform_real/first_run_sizes.py show "$RUNNER_TEMP/setup.log")"
          exit $status

      - name: Start the daemon it installed and check that it answers
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$HOME/.config/heliox-os/env/Scripts/python.exe"; else PY="$HOME/.config/heliox-os/env/bin/python"; fi
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 240
          status=$?
          if [ $status -ne 0 ]; then tail -60 "$RUNNER_TEMP/daemon.log"; fi
          exit $status

      - name: Repair - an environment whose Python is gone is rebuilt with the same parts
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export HELIOX_SETUP_DIR="$HOME/.config/heliox-os" HELIOX_CORE_REQ="$GITHUB_WORKSPACE/daemon" HELIOX_PYTHON="${{ matrix.python }}"
          V=tauri-app/src-tauri/setup/python-versions.json
          export HELIOX_PYTHON_MIN="$(sed -n 's/.*"min": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_MAX="$(sed -n 's/.*"max": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_PRIVATE="$(sed -n 's/.*"private": *"\([0-9.]*\)".*/\1/p' $V)"
          case "$RUNNER_OS" in
            Linux) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[linux]" ;;
            macOS) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[macos]" ;;
            *) export HELIOX_GROUPS="" ;;
          esac
          # Stop the daemon the previous step started, then break the environment the way an upgrade of its base
          # Python or a half-finished deletion does: its interpreter is gone.
          pkill -f "pilot.server" 2>/dev/null || taskkill //F //IM python.exe >/dev/null 2>&1 || true
          sleep 2
          if [ "$RUNNER_OS" = "Windows" ]; then
            export HELIOX_SETUP_DIR="$(cygpath -w "$HELIOX_SETUP_DIR")" HELIOX_CORE_REQ="$(cygpath -w "$HELIOX_CORE_REQ")"
            rm -f "$HOME/.config/heliox-os/env/Scripts/python.exe"
            powershell -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/setup/first-run.ps1 run | tee "$RUNNER_TEMP/repair.log"
            PY="$HOME/.config/heliox-os/env/Scripts/python.exe"
          else
            rm -f "$HOME/.config/heliox-os/env/bin/python"
            sh tauri-app/src-tauri/setup/first-run.sh run | tee "$RUNNER_TEMP/repair.log"
            PY="$HOME/.config/heliox-os/env/bin/python"
          fi
          status=${PIPESTATUS[0]}
          grep "^@@step" "$RUNNER_TEMP/repair.log"
          grep -q "no longer starts; building it again" "$RUNNER_TEMP/repair.log" || { echo "repair was not detected"; exit 1; }
          [ ! -e "$HOME/.config/heliox-os/env.broken" ] || { echo "the broken environment was left behind"; exit 1; }
          [ $status -eq 0 ] || exit $status
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon2.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 240

  # ── Update from the previous release (experimental, non-blocking) ──
  # Installs the released pilot-daemon 0.15.0 the way an older desktop app did, then runs the app's update path
  # (tauri-app/src-tauri/setup/update.py) to this checkout: first an update that cannot install, which must leave
  # 0.15.0 exactly as it was, then the real one, after which the updated daemon must answer its RPC.
  update-path:
    name: Update path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the previous release as an older app did
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          ENV="$RUNNER_TEMP/home/.config/heliox-os/env"
          mkdir -p "$(dirname "$ENV")"
          python -m venv "$ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$ENV/Scripts/python.exe"; else PY="$ENV/bin/python"; fi
          "$PY" -m pip install --disable-pip-version-check --progress-bar off "pilot-daemon==0.15.0"
          "$PY" -c "import importlib.metadata as m; print('installed', m.version('pilot-daemon'))"

      - name: An update that breaks the daemon is rolled back to the old version exactly
        run: |
          set +e
          ENV="$RUNNER_TEMP/home/.config/heliox-os/env"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$ENV/Scripts/python.exe"; else PY="$ENV/bin/python"; fi
          # A "pilot-daemon 99.0.0" that installs cleanly but has no pilot.server: the check after installing fails.
          FAKE="$RUNNER_TEMP/fake-daemon"
          mkdir -p "$FAKE/pilot_fake"
          printf '[project]\nname = "pilot-daemon"\nversion = "99.0.0"\n[tool.setuptools]\npackages = ["pilot_fake"]\n' > "$FAKE/pyproject.toml"
          touch "$FAKE/pilot_fake/__init__.py"
          before=$("$PY" -m pip freeze --disable-pip-version-check | sort | md5sum 2>/dev/null || "$PY" -m pip freeze | sort | md5)
          python tauri-app/src-tauri/setup/update.py apply --env "$ENV" --version 99.0.0 --source "$FAKE" | grep "^@@"
          status=${PIPESTATUS[0]}
          after=$("$PY" -m pip freeze --disable-pip-version-check | sort | md5sum 2>/dev/null || "$PY" -m pip freeze | sort | md5)
          version=$("$PY" -c "import importlib.metadata as m, pilot.server; print(m.version('pilot-daemon'))")
          echo "exit $status; installed after: $version; packages unchanged: $([ "$before" = "$after" ] && echo yes || echo no)"
          [ $status -ne 0 ] && [ "$version" = "0.15.0" ] && [ "$before" = "$after" ] && [ ! -e "$ENV.previous" ]

      - name: Plan and apply the update to this checkout
        run: |
          set +e
          ENV="$RUNNER_TEMP/home/.config/heliox-os/env"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' tauri-app/src-tauri/Cargo.toml | head -1)
          python tauri-app/src-tauri/setup/update.py plan --env "$ENV" --version "$VERSION" --source "$GITHUB_WORKSPACE/daemon" | grep "^@@"
          start=$(date +%s)
          python tauri-app/src-tauri/setup/update.py apply --env "$ENV" --version "$VERSION" --source "$GITHUB_WORKSPACE/daemon" --groups-file "$RUNNER_TEMP/setup.json" | tee "$RUNNER_TEMP/update.log" | grep "^@@"
          status=${PIPESTATUS[0]}
          echo "update exit code $status after $(( $(date +%s) - start )) s"
          cat "$RUNNER_TEMP/setup.json" 2>/dev/null
          exit $status

      - name: The updated daemon answers
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          ENV="$HOME/.config/heliox-os/env"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$ENV/Scripts/python.exe"; else PY="$ENV/bin/python"; fi
          "$PY" -c "import importlib.metadata as m; print('installed', m.version('pilot-daemon'))"
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 240
          status=$?
          if [ $status -ne 0 ]; then tail -60 "$RUNNER_TEMP/daemon.log"; fi
          exit $status

  # ── macOS type check of the desktop app (non-blocking) ──
  # The Rust job runs on Ubuntu and a Windows check is done locally; this compiles the app for macOS so a Mac-only
  # error is found here, not by someone building a release.
  rust-macos:
    name: Rust check (macOS)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Build frontend (Tauri embeds it)
        working-directory: tauri-app/ui
        run: npm ci && npx vite build

      - name: Cargo check
        working-directory: tauri-app/src-tauri
        run: cargo check --all-targets

      # Real removal on a Mac's file system (APFS): app files go, data stays, a link out of Heliox's folders is not
      # followed. The same test runs on Linux in the Rust job.
      - name: Remove Heliox's files (unit tests on a real file system)
        working-directory: tauri-app/src-tauri
        run: cargo test --all-targets -- uninstall
