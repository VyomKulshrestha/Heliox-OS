name: "CI — Lint & Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Python Linting & Tests ──
  python:
    name: Python (Ruff + Pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[full,dev]" || pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check . --output-format=github --no-cache

      - name: Ruff format check
        run: ruff format --check . --no-cache

      - name: Run tests
        run: pip install pytest-timeout && pytest tests/ -v --tb=short --timeout=300

      # Which steps hold the event loop longer than 100 ms (asyncio debug mode, tests/loop_watch.py), with the test
      # name, on these quiet runners. For reading, not a gate: a step over 100 ms is a person waiting on the daemon.
      - name: Event-loop steps over 100 ms (session suite, IPC, typed end to end)
        if: ${{ !cancelled() }} # also after a failed "Run tests": its lines matter most then
        continue-on-error: true
        env:
          HELIOX_LOOP_WATCH: "1"
          PYTHONPATH: tests
        run: >
          pytest -p loop_watch -q --timeout=600
          tests/test_conversation_sessions.py tests/test_ipc_integration.py tests/test_conversation_typed_e2e.py
          tests/test_start_loop_steps.py

  # ── Frontend Linting ──
  frontend:
    name: Svelte (Prettier + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-app/ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Install dependencies
        run: |
          success=false
          for i in {1..3}; do
            if npm ci || npm install; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Installation failed after 3 attempts"
            exit 1
          fi

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{svelte,ts,js,css}" "vite.config.ts"

      - name: Svelte check (type checking)
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Static frontend checks
        run: npm run test:static

      - name: Frontend unit tests
        run: npm run test:unit -- --run

      - name: Build check
        run: npx vite build

  approval-regression:
    name: Same-WebSocket Approval Regression
    # Pinned: ubuntu-latest moved to 26.04, where this Playwright release cannot install Chromium.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: daemon/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Install controlled smoke dependencies
        run: |
          python -m pip install -e "./daemon[browser]"
          npm ci --prefix tauri-app/ui
          npm exec --prefix tauri-app/ui -- playwright install --with-deps chromium
          python -m playwright install chromium

      - name: Run deterministic approval-to-navigation regression
        working-directory: tauri-app/ui
        run: npm run test:e2e:approval -- --reporter=github
        env:
          CI: "true"

      - name: Upload approval evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: approval-regression-evidence
          path: tauri-app/ui/test-results/
          retention-days: 7

  # ── Visual Regression Tests ──
  visual-regression:
    name: Visual Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the image the Linux baselines were rendered on; ubuntu-latest (26.04) has no Playwright Chromium.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: tauri-app/ui
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Install dependencies
        run: |
          success=false
          for i in {1..3}; do
            if npm ci || npm install; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Installation failed after 3 attempts"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check if baselines exist for this OS
        id: check_baselines
        run: |
          # Playwright appends the OS name to snapshots (e.g. -linux.png, -win32.png, -darwin.png)
          OS_SUFFIX="linux"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then OS_SUFFIX="win32"; fi
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then OS_SUFFIX="darwin"; fi
          echo "os_suffix=$OS_SUFFIX" >> $GITHUB_OUTPUT
          
          SNAPSHOT_DIR="tests/visual/__snapshots__"
          if [ -n "$(find $SNAPSHOT_DIR -name "*${OS_SUFFIX}.png" 2>/dev/null | head -1)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate missing baseline snapshots
        if: steps.check_baselines.outputs.exists == 'false'
        run: npx playwright test --update-snapshots --reporter=github
        env:
          CI: "true"

      - name: Upload generated baselines for review
        if: steps.check_baselines.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-${{ matrix.os }}
          path: tauri-app/ui/tests/visual/__snapshots__/**/*-chromium-${{ steps.check_baselines.outputs.os_suffix }}.png
          if-no-files-found: error
          retention-days: 7

      - name: Run visual regression tests (comparison)
        run: npx playwright test --reporter=github
        env:
          CI: "true"

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs-${{ matrix.os }}
          path: tauri-app/ui/test-results/
          retention-days: 7

  # ── Rust Linting ──
  rust:
    name: Rust (Clippy + Fmt)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      # Build frontend first (Tauri needs it)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Build frontend
        working-directory: tauri-app/ui
        run: |
          success=false
          for i in {1..3}; do
            if npm ci || npm install; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Installation failed after 3 attempts"
            exit 1
          fi
          npx vite build

      - name: Cargo fmt check
        working-directory: tauri-app/src-tauri
        run: cargo fmt -- --check

      - name: Cargo clippy
        working-directory: tauri-app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests
        working-directory: tauri-app/src-tauri
        run: cargo test --all-targets

  # ── Real platform readers (experimental, non-blocking) ──
  # Exercises the focused-text readers against real accessibility stacks on hosted runners: AT-SPI on Linux,
  # the Accessibility API on macOS, UI Automation on Windows.
  # The unit tests for the same code run in the `python` job on every system. This job is allowed to fail while
  # the runner setups are being proved; make it required once it has passed on three consecutive pushes to main.
  platform-readers:
    name: Platform readers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: daemon
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the daemon with its platform extra
        run: |
          # Windows needs no extra: its reader is a PowerShell helper over UI Automation.
          case "$RUNNER_OS" in
            Linux) pip install -e ".[linux]" ;;
            macOS) pip install -e ".[macos]" ;;
            *) pip install -e . ;;
          esac
          pip list 2>/dev/null | grep -iE "jeepney|pyobjc-framework-(ApplicationServices|Cocoa|Quartz)" || true

      - name: Install the Linux accessibility stack (AT-SPI, GTK 3, Xvfb, xdotool)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xdotool dbus dbus-x11 at-spi2-core libatk-adaptor \
            python3-gi gir1.2-gtk-3.0 tesseract-ocr scrot
          ls /usr/share/dbus-1/services/ | grep -i a11y || echo "no org.a11y.Bus service file"

      - name: Linux, quiet in calls - another app recording is seen through PulseAudio
        if: runner.os == 'Linux'
        # Its own failure must not stop the accessibility checks below.
        continue-on-error: true
        run: |
          pip install pytest pytest-asyncio pytest-timeout sounddevice soundcard
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils libportaudio2 libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-source source_name=heliox_mic
          pactl load-module module-null-source source_name=heliox_headset
          pactl set-default-source heliox_headset
          HELIOX_REAL_PULSE=1 pytest tests/test_call_detection_mac_linux.py tests/test_audio_health.py -q --timeout=120 \
            -k "real"

      - name: Linux, audio - Heliox's voice reaches the default sink, and the default microphone is followed
        if: runner.os == 'Linux'
        continue-on-error: true
        # PulseAudio is still running from the step above.
        run: |
          set +e
          failed=0
          python tests/platform_real/audio_check.py playback || failed=$((failed + 1))
          python tests/platform_real/audio_check.py follow || failed=$((failed + 1))
          exit $failed

      - name: Linux, X11 session - type into a GTK field and read it through AT-SPI
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
            export DISPLAY=:99 GTK_A11Y=atspi
            sleep 2
            python tests/platform_real/linux_atspi_check.py --python /usr/bin/python3
            reader=$?
            # Live end to end: a slip typed into the GTK field becomes a card; excluded app, password field, closed
            # window.
            python tests/platform_real/live_end_to_end_check.py --python /usr/bin/python3
            reader=$(( reader + $? ))
            # Live never reads the window of a password manager or of Heliox itself; an error on screen; back and forth.
            python tests/platform_real/live_more_checks.py --python /usr/bin/python3
            exit $(( reader + $? ))
          '

      # A first-day person opens an app by name and moves its windows: the planner's launch, the names the timeline
      # shows, and the window tools, against a real window manager (openbox) with two GTK windows.
      - name: Linux, X11 - launching an app by its desktop entry, app names, and window actions under openbox
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          sudo apt-get install -y -q --no-install-recommends openbox wmctrl x11-utils
          dbus-run-session -- bash -c '
            Xvfb :98 -screen 0 1280x800x24 >/tmp/xvfb-wm.log 2>&1 &
            export DISPLAY=:98 GTK_A11Y=atspi
            sleep 2
            openbox >/tmp/openbox.log 2>&1 &
            sleep 1
            failed=0
            python tests/platform_real/apps_check.py || failed=$((failed + 1))
            python tests/platform_real/linux_windows_check.py --python /usr/bin/python3 || failed=$((failed + 1))
            exit $failed
          '

      # What a first-day person meets beyond typing: the screen read without a desktop's own OCR, the fallback voice,
      # notifications, a GTK 4 app and Firefox, a control with no accessibility action, an app that hangs, and a
      # protected folder named in another case. "Before" checks run before their package is installed.
      - name: Linux, X11 - OCR, speech, notifications, GTK 4 and Firefox, a centre click, a hung app, a protected folder
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          set +e
          failed=0
          python tests/platform_real/speech_check.py no-voice || failed=$((failed + 1))
          python tests/platform_real/notify_check.py missing || failed=$((failed + 1))
          python tests/platform_real/protected_case_check.py || failed=$((failed + 1))
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr scrot espeak-ng libnotify-bin dunst \
            gir1.2-gtk-4.0 openbox
          pip install -q pyautogui
          python tests/platform_real/speech_check.py speak || failed=$((failed + 1))
          dbus-run-session -- bash -c '
            Xvfb :97 -screen 0 1280x800x24 >/tmp/xvfb-more.log 2>&1 &
            export DISPLAY=:97 GTK_A11Y=atspi
            sleep 2
            openbox >/tmp/openbox-more.log 2>&1 &
            sleep 1
            failed=0
            python tests/platform_real/notify_check.py no-daemon || failed=$((failed + 1))
            dunst >/tmp/dunst.log 2>&1 &
            sleep 1
            python tests/platform_real/notify_check.py shown || failed=$((failed + 1))
            python tests/platform_real/ocr_check.py linux || failed=$((failed + 1))
            python tests/platform_real/toolkit_check.py gtk4 --python /usr/bin/python3 || failed=$((failed + 1))
            # Live: a GTK 4 window titled like a password manager or like Heliox is never read (needs GTK 4, here).
            python tests/platform_real/live_more_checks.py --only gtk4-never-read --python /usr/bin/python3 || failed=$((failed + 1))
            # Live: an app it cannot see into (a GTK window kept off the accessibility bus) is named once, quietly.
            python tests/platform_real/live_more_checks.py --only blind-spot --python /usr/bin/python3 || failed=$((failed + 1))
            python tests/platform_real/toolkit_check.py firefox || failed=$((failed + 1))
            python tests/platform_real/click_hang_check.py --python /usr/bin/python3 || failed=$((failed + 1))
            exit $failed
          '
          failed=$((failed + $?))
          exit $failed

      # Where people type: a browser, an Electron app and a Qt app. Each shows a text field and a password field.
      # Each app runs with the desktop switch off and on, with and without its own switch: setups with the desktop
      # switch on must read the field, the others are ANSWER lines; the password field must be refused wherever the
      # text field was read.
      - name: Linux, X11 - fields in Chrome, Electron and Qt, by default and with accessibility forced on
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          set +e
          # PySide6 needs libEGL and libGL even for widgets (CI on 7f553b9: "libEGL.so.1: cannot open shared object
          # file"), and its xcb platform plugin the xcb extension libraries.
          sudo apt-get install -y -q --no-install-recommends openbox libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 \
            libegl1 libgl1 libopengl0 libfontconfig1 libdbus-1-3 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 \
            libxcb-sync1 libxcb-xkb1
          pip install -q "PySide6==6.8.1"
          mkdir -p "$RUNNER_TEMP/electron"
          npm install --prefix "$RUNNER_TEMP/electron" --no-save --no-audit --no-fund electron@33.2.1 >/dev/null 2>&1
          export HELIOX_ELECTRON="$RUNNER_TEMP/electron/node_modules/.bin/electron"
          ls -l "$HELIOX_ELECTRON" || echo "electron did not install"
          which google-chrome chromium chromium-browser || true
          dbus-run-session -- bash -c '
            Xvfb :96 -screen 0 1280x800x24 >/tmp/xvfb-fields.log 2>&1 &
            export DISPLAY=:96
            sleep 2
            openbox >/tmp/openbox-fields.log 2>&1 &
            sleep 1
            python tests/platform_real/apps_fields_check.py chrome-default chrome-switch chrome-forced \
              chrome-forced-switch chrome-env chrome-late electron-default electron-switch electron-forced \
              electron-forced-switch electron-env electron-late qt-default qt-switch qt-forced
          '

      # Weston's headless backend has no seat, so nothing can take keyboard focus there (first run: GTK logged
      # gdk_seat_get_keyboard assertions and no element was ever focused). Sway on wlroots' headless backend
      # always has a seat, focuses new windows, and accepts keys from wtype through the virtual-keyboard protocol.
      - name: Linux, Wayland session (sway headless) - the same checks without X
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          sudo apt-get install -y -q --no-install-recommends sway wtype gir1.2-gtk-4.0
          dbus-run-session -- bash -c '
            export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
            printf "output HEADLESS-1 resolution 1280x800\n" > /tmp/sway.conf
            WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /tmp/sway.conf >/tmp/sway.log 2>&1 &
            sock=""
            for i in $(seq 1 50); do
              sock=$(ls "$XDG_RUNTIME_DIR" | grep -E "^wayland-[0-9]+$" | head -1)
              [ -n "$sock" ] && break
              sleep 0.2
            done
            echo "sway socket: ${sock:-none}"
            unset DISPLAY
            export WAYLAND_DISPLAY=$sock GDK_BACKEND=wayland
            python tests/platform_real/linux_atspi_check.py --wayland --python /usr/bin/python3
            status=$?
            python tests/platform_real/live_end_to_end_check.py --wayland --python /usr/bin/python3
            status=$(( status + $? ))
            python tests/platform_real/live_more_checks.py --wayland --python /usr/bin/python3
            status=$(( status + $? ))
            # A GTK 4 password entry under Wayland: refused, with DIAG lines of how GTK 4 marks it.
            python tests/platform_real/toolkit_check.py gtk4 --wayland --python /usr/bin/python3
            status=$(( status + $? ))
            tail -20 /tmp/sway.log
            exit $status
          '

      # Screenshots on Wayland go through the desktop's portal. Under sway, xdg-desktop-portal-wlr answers without a
      # dialog, so this proves Heliox's client end to end; GNOME's and KDE's consent dialogs are not proven here.
      # GlobalShortcuts is not in xdg-desktop-portal-wlr: the client is checked against a fake portal on its own bus.
      # xdg-desktop-portal-wlr (Screenshot version 1, so the front end asks no permission) runs grim to take the
      # picture; without grim its call returns -1, which sd-bus reports as "Operation not permitted" (CI, 12 November).
      - name: Linux, Wayland portals (Screenshot under sway, GlobalShortcuts against a fake portal)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y -q --no-install-recommends sway xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk pipewire grim
          mkdir -p "$HOME/.config/xdg-desktop-portal"
          printf "[preferred]\ndefault=wlr;gtk\norg.freedesktop.impl.portal.Screenshot=wlr\norg.freedesktop.impl.portal.Access=gtk\n" > "$HOME/.config/xdg-desktop-portal/sway-portals.conf"
          ls /usr/share/xdg-desktop-portal/portals/ /usr/share/dbus-1/services/ | grep -i portal || true
          dbus-run-session -- bash -c '
            export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
            export XDG_CURRENT_DESKTOP=sway
            printf "output HEADLESS-1 resolution 1280x800\n" > /tmp/sway-portal.conf
            WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /tmp/sway-portal.conf >/tmp/sway-portal.log 2>&1 &
            sock=""
            for i in $(seq 1 50); do
              sock=$(ls "$XDG_RUNTIME_DIR" | grep -E "^wayland-[0-9]+$" | head -1)
              [ -n "$sock" ] && break
              sleep 0.2
            done
            unset DISPLAY
            export WAYLAND_DISPLAY=$sock
            dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR
            # No systemd user session on the runner: start PipeWire, the wlr backend and the portal here, in that
            # order, with their logs. The backend initialises screen casting at start and exits when it cannot reach
            # PipeWire (CI, 12 November: "pipewire could not connect to context"), taking Screenshot with it; the
            # front end only uses backends that are on the bus when it starts.
            pipewire >/tmp/pipewire.log 2>&1 &
            sleep 1
            /usr/libexec/xdg-desktop-portal-wlr -l DEBUG >/tmp/xdpw.log 2>&1 &
            # The front end exports Screenshot only when some backend implements Access (the consent dialog);
            # xdg-desktop-portal-gtk does. It must be on the bus before the front end starts.
            GDK_BACKEND=wayland /usr/libexec/xdg-desktop-portal-gtk >/tmp/xdpg.log 2>&1 &
            xdpw=$!
            sleep 1
            if kill -0 $xdpw 2>/dev/null; then echo "xdg-desktop-portal-wlr is running"; else wait $xdpw; echo "xdg-desktop-portal-wlr exited with status $?"; fi
            /usr/libexec/xdg-desktop-portal -v -r >/tmp/xdp.log 2>&1 &
            sleep 2
            python tests/platform_real/linux_portal_check.py real
            status=$?
            # Live reading an error off the screen under sway, through this portal (the Live step has no portal).
            python tests/platform_real/live_more_checks.py --wayland --only error-on-screen --python /usr/bin/python3
            status=$(( status + $? ))
            if [ $status -ne 0 ]; then
              echo "--- xdg-desktop-portal log"; tail -40 /tmp/xdp.log
              echo "--- xdg-desktop-portal-wlr log"; tail -40 /tmp/xdpw.log
              echo "--- pipewire log"; tail -20 /tmp/pipewire.log
              echo "--- xdg-desktop-portal-gtk log"; tail -20 /tmp/xdpg.log
              kill -0 $xdpw 2>/dev/null && echo "xdg-desktop-portal-wlr still running" || echo "xdg-desktop-portal-wlr not running"
            fi
            exit $status
          '
          real=$?
          dbus-run-session -- python tests/platform_real/linux_portal_check.py fake
          fake=$?
          exit $(( real + fake ))

      - name: macOS - permissions, frontmost app and the Accessibility reader
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          sw_vers
          python tests/platform_real/macos_ax_check.py

      # Live end to end on macOS: a slip typed into a real field becomes a card, then the windows Live never
      # reads, an error on screen, and back and forth. Its own step, so a failed reader check does not hide it.
      - name: macOS - Live end to end, and the windows Live never reads
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          set +e
          python tests/platform_real/live_end_to_end_check.py
          live=$?
          python tests/platform_real/live_more_checks.py
          exit $(( live + $? ))

      - name: macOS - launching TextEdit by name, and app names from real bundles
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        run: python tests/platform_real/apps_check.py

      # Where people type on a Mac: Safari, Chrome and an Electron app, each showing a text field and a password
      # field. The default setup of each (with Heliox's reader as it is) and AXEnhancedUserInterface are ANSWERs,
      # with how the window takes a move; with AXManualAccessibility set or the app's own switch the field must be
      # read; the password field must be refused wherever it was read.
      - name: macOS - fields in Safari, Chrome and Electron, by default and with accessibility turned on
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          set +e
          pip install -q pyautogui
          mkdir -p "$RUNNER_TEMP/electron"
          npm install --prefix "$RUNNER_TEMP/electron" --no-save --no-audit --no-fund electron@33.2.1 >/dev/null 2>&1
          export HELIOX_ELECTRON="$RUNNER_TEMP/electron/node_modules/.bin/electron"
          ls -l "$HELIOX_ELECTRON" || echo "electron did not install"
          ls -d "/Applications/Google Chrome.app" || echo "Google Chrome is not on this runner"
          python tests/platform_real/apps_fields_macos_check.py safari-default chrome-default chrome-manual \
            chrome-enhanced chrome-forced electron-default electron-manual electron-enhanced electron-forced

      - name: macOS - OCR without pyobjc, speech to a file, a notification, APFS case, a centre click, a hung app, the probe
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          set +e
          failed=0
          pip install -q pyautogui
          python tests/platform_real/ocr_check.py render "$RUNNER_TEMP/line.png" || failed=$((failed + 1))
          python -m venv "$RUNNER_TEMP/no-pyobjc"
          "$RUNNER_TEMP/no-pyobjc/bin/pip" install -q --disable-pip-version-check -e . || failed=$((failed + 1))
          brew install tesseract >/dev/null 2>&1 || echo "tesseract could not be installed; its route is not run"
          "$RUNNER_TEMP/no-pyobjc/bin/python" tests/platform_real/ocr_check.py mac-fallback "$RUNNER_TEMP/line.png" \
            || failed=$((failed + 1))
          python tests/platform_real/speech_check.py speak || failed=$((failed + 1))
          python tests/platform_real/notify_check.py shown || failed=$((failed + 1))
          python tests/platform_real/protected_case_check.py || failed=$((failed + 1))
          python tests/platform_real/click_hang_check.py || failed=$((failed + 1))
          python tests/platform_real/probe_check.py || failed=$((failed + 1))
          exit $failed

      - name: Live terminal check in real zsh and fish sessions
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -q --no-install-recommends zsh fish netcat-openbsd
          else
            brew install fish >/dev/null
          fi
          zsh --version; fish --version
          python tests/platform_real/shell_integration_check.py
          shell=$?
          python tests/platform_real/shell_prompts_check.py
          exit $(( shell + $? ))

      # kitty read through its own remote control, without changing the shell. WezTerm is checked too when the
      # runner has it (it is not in Ubuntu's archive); the unit tests cover its answers.
      - name: Live reads kitty (and WezTerm) directly
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          sudo apt-get install -y -q --no-install-recommends kitty xvfb
          dbus-run-session -- bash -c '
            Xvfb :98 -screen 0 1280x800x24 >/tmp/xvfb98.log 2>&1 &
            export DISPLAY=:98
            sleep 2
            python tests/platform_real/terminal_text_check.py
          '

      # Where people type on Windows: Edge and Chrome, each showing a text field and a password field, read by
      # the UI Automation reader Live uses. The default setup of each is an ANSWER; with
      # --force-renderer-accessibility Chrome must read the field; the password field must be refused wherever
      # the text field was read.
      - name: Windows - fields in Edge and Chrome, read through UI Automation
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        run: |
          pip install -q pyautogui
          python tests/platform_real/windows_fields_check.py edge-default chrome-default chrome-forced

      - name: Unit tests for the readers on this runner
        if: ${{ !cancelled() }}
        run: |
          pip install pytest pytest-asyncio pytest-timeout
          pytest tests/test_platform_readers.py tests/test_platform_quiet_failures.py tests/test_live_shell_line.py tests/test_live_terminal_text.py -q --timeout=120

  # ── First run from nothing (experimental, non-blocking) ──
  # Runs the app's own first-run script (tauri-app/src-tauri/setup) in an empty home folder with the core only
  # (plus the platform readers on macOS and Linux), starts the daemon it installed and checks that it answers its
  # RPC. "private" proves the path for a machine without Python 3.11+ (uv and a private Python); "auto" uses the
  # runner's Python. The daemon comes from this checkout, as the released version may not be on PyPI yet.
  first-run:
    name: First run (${{ matrix.os }}, ${{ matrix.python }} Python)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: [auto, private]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Run the first-run script in an empty home folder
        env:
          HELIOX_PYTHON: ${{ matrix.python }}
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export HELIOX_SETUP_DIR="$HOME/.config/heliox-os"
          export HELIOX_CORE_REQ="$GITHUB_WORKSPACE/daemon"
          # Download sizes for the first-run screen: pip's cache starts empty and the script reports it after each step.
          export PIP_CACHE_DIR="$RUNNER_TEMP/pip-cache" HELIOX_MEASURE_PIP_CACHE="$RUNNER_TEMP/pip-cache"
          # The Python range the app passes to the script (setup.rs reads the same file).
          V=tauri-app/src-tauri/setup/python-versions.json
          export HELIOX_PYTHON_MIN="$(sed -n 's/.*"min": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_MAX="$(sed -n 's/.*"max": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_PRIVATE="$(sed -n 's/.*"private": *"\([0-9.]*\)".*/\1/p' $V)"
          echo "Python range ${HELIOX_PYTHON_MIN} to ${HELIOX_PYTHON_MAX}, private ${HELIOX_PYTHON_PRIVATE}"
          mkdir -p "$PIP_CACHE_DIR"
          case "$RUNNER_OS" in
            Linux) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[linux]" ;;
            macOS) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[macos]" ;;
            *) export HELIOX_GROUPS="" ;;
          esac
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Windows" ]; then
            export HELIOX_SETUP_DIR="$(cygpath -w "$HELIOX_SETUP_DIR")" HELIOX_CORE_REQ="$(cygpath -w "$HELIOX_CORE_REQ")"
            powershell -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/setup/first-run.ps1 probe | tee "$RUNNER_TEMP/probe.log"
            powershell -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/setup/first-run.ps1 run | tee "$RUNNER_TEMP/setup.log"
          else
            sh tauri-app/src-tauri/setup/first-run.sh probe | tee "$RUNNER_TEMP/probe.log"
            sh tauri-app/src-tauri/setup/first-run.sh run | tee "$RUNNER_TEMP/setup.log"
          fi
          # The runners have no NVIDIA card: the probe says so, and the voice on the graphics card is not offered.
          if grep -q "^@@gpu none" "$RUNNER_TEMP/probe.log"; then
            echo "CHECK first-run/gpu-probe: PASS - no NVIDIA card found, so the voice on the graphics card is not offered"
          else
            echo "CHECK first-run/gpu-probe: FAIL - $(grep '^@@gpu' "$RUNNER_TEMP/probe.log" || echo 'no @@gpu line')"
          fi
          status=${PIPESTATUS[0]}
          echo "setup exit code $status after $(( $(date +%s) - start )) s"
          grep "^@@" "$RUNNER_TEMP/setup.log"
          du -sh "$HOME/.config/heliox-os"/* 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$HOME/.config/heliox-os/env/Scripts/python.exe"; else PY="$HOME/.config/heliox-os/env/bin/python"; fi
          echo "FIRST_RUN_SIZES $RUNNER_OS ${{ matrix.python }} $("$PY" daemon/tests/platform_real/first_run_sizes.py show "$RUNNER_TEMP/setup.log")"
          exit $status

      # The start-up times below are the daemon's own (pilot.system.startup_timing: seconds from its process start to
      # listening, ready and every late part started, and the modules loaded), on these small CPU-only runners. The
      # keyring is off, as on a Linux machine without a secret service, so the learner's key is the owner-only file.
      - name: Start the daemon it installed and check that it answers
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
          HELIOX_STARTUP_TIMINGS: "1"
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$HOME/.config/heliox-os/env/Scripts/python.exe"; else PY="$HOME/.config/heliox-os/env/bin/python"; fi
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 240 --timings=first-run
          status=$?
          grep "Start-up timing" "$RUNNER_TEMP/daemon.log"
          if [ $status -ne 0 ]; then tail -60 "$RUNNER_TEMP/daemon.log"; fi
          exit $status

      - name: Start-up with 100,000 events in the ledger, with and without a saved learner state
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
          HELIOX_STARTUP_TIMINGS: "1"
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$HOME/.config/heliox-os/env/Scripts/python.exe"; else PY="$HOME/.config/heliox-os/env/bin/python"; fi
          # The rest of a fake home (pilot.real_folders): the per-user Windows folder, the XDG folders a runner image
          # may set, and the Linux runtime folder, none of which follow HOME. Without them a server built outside the
          # daemon is refused.
          export LOCALAPPDATA="$HOME/AppData/Local"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          if [ "$RUNNER_OS" = "Linux" ]; then export XDG_RUNTIME_DIR="$HOME/.runtime"; mkdir -p -m 700 "$XDG_RUNTIME_DIR"; fi
          stop_daemon() { pkill -f "pilot.server" 2>/dev/null || taskkill //F //IM python.exe >/dev/null 2>&1 || true; sleep 3; }
          stop_daemon
          "$PY" daemon/tests/platform_real/seed_ledger.py 100000 --snapshot
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon-saved.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 300 --timings=saved-state
          saved=$?
          grep "Start-up timing\|Learner loaded" "$RUNNER_TEMP/daemon-saved.log"
          stop_daemon
          # The same ledger with no saved state: the learner replays all of it after ready.
          "$PY" -c "from pilot.config import DATA_DIR; (DATA_DIR / 'online_learning_snapshot.bin').unlink(missing_ok=True)"
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon-replay.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 600 --timings=full-replay
          replay=$?
          grep "Start-up timing\|Learner loaded" "$RUNNER_TEMP/daemon-replay.log"
          [ $saved -eq 0 ] || tail -60 "$RUNNER_TEMP/daemon-saved.log"
          [ $replay -eq 0 ] || tail -60 "$RUNNER_TEMP/daemon-replay.log"
          [ $saved -eq 0 ] && [ $replay -eq 0 ]

      - name: Repair - an environment whose Python is gone is rebuilt with the same parts
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export HELIOX_SETUP_DIR="$HOME/.config/heliox-os" HELIOX_CORE_REQ="$GITHUB_WORKSPACE/daemon" HELIOX_PYTHON="${{ matrix.python }}"
          V=tauri-app/src-tauri/setup/python-versions.json
          export HELIOX_PYTHON_MIN="$(sed -n 's/.*"min": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_MAX="$(sed -n 's/.*"max": *"\([0-9.]*\)".*/\1/p' $V)"
          export HELIOX_PYTHON_PRIVATE="$(sed -n 's/.*"private": *"\([0-9.]*\)".*/\1/p' $V)"
          case "$RUNNER_OS" in
            Linux) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[linux]" ;;
            macOS) export HELIOX_GROUPS="platform=$GITHUB_WORKSPACE/daemon[macos]" ;;
            *) export HELIOX_GROUPS="" ;;
          esac
          # Stop the daemon the previous step started, then break the environment the way an upgrade of its base
          # Python or a half-finished deletion does: its interpreter is gone.
          pkill -f "pilot.server" 2>/dev/null || taskkill //F //IM python.exe >/dev/null 2>&1 || true
          sleep 2
          # Settings and data must come through the repair byte for byte (a marker in each, and every file's hash).
          if [ "$RUNNER_OS" = "Windows" ]; then OLD="$HOME/.config/heliox-os/env/Scripts/python.exe"; else OLD="$HOME/.config/heliox-os/env/bin/python"; fi
          "$OLD" daemon/tests/platform_real/repair_data_check.py before "$RUNNER_TEMP/repair-data.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export HELIOX_SETUP_DIR="$(cygpath -w "$HELIOX_SETUP_DIR")" HELIOX_CORE_REQ="$(cygpath -w "$HELIOX_CORE_REQ")"
            rm -f "$HOME/.config/heliox-os/env/Scripts/python.exe"
            powershell -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/setup/first-run.ps1 run | tee "$RUNNER_TEMP/repair.log"
            PY="$HOME/.config/heliox-os/env/Scripts/python.exe"
          else
            rm -f "$HOME/.config/heliox-os/env/bin/python"
            sh tauri-app/src-tauri/setup/first-run.sh run | tee "$RUNNER_TEMP/repair.log"
            PY="$HOME/.config/heliox-os/env/bin/python"
          fi
          status=${PIPESTATUS[0]}
          grep "^@@step" "$RUNNER_TEMP/repair.log"
          grep -q "no longer starts; building it again" "$RUNNER_TEMP/repair.log" || { echo "repair was not detected"; exit 1; }
          [ ! -e "$HOME/.config/heliox-os/env.broken" ] || { echo "the broken environment was left behind"; exit 1; }
          [ $status -eq 0 ] || exit $status
          "$PY" daemon/tests/platform_real/repair_data_check.py after "$RUNNER_TEMP/repair-data.json"
          kept=$?
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon2.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 240
          exit $(( $? + kept ))

  # ── Update from the previous release (experimental, non-blocking) ──
  # Installs the released pilot-daemon 0.15.0 the way an older desktop app did, then runs the app's update path
  # (tauri-app/src-tauri/setup/update.py) to this checkout: first an update that cannot install, which must leave
  # 0.15.0 exactly as it was, then the real one, after which the updated daemon must answer its RPC.
  update-path:
    name: Update path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the previous release as an older app did
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          ENV="$RUNNER_TEMP/home/.config/heliox-os/env"
          mkdir -p "$(dirname "$ENV")"
          python -m venv "$ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$ENV/Scripts/python.exe"; else PY="$ENV/bin/python"; fi
          "$PY" -m pip install --disable-pip-version-check --progress-bar off "pilot-daemon==0.15.0"
          "$PY" -c "import importlib.metadata as m; print('installed', m.version('pilot-daemon'))"

      - name: An update that breaks the daemon is rolled back to the old version exactly
        run: |
          set +e
          ENV="$RUNNER_TEMP/home/.config/heliox-os/env"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$ENV/Scripts/python.exe"; else PY="$ENV/bin/python"; fi
          # A "pilot-daemon 99.0.0" that installs cleanly but has no pilot.server: the check after installing fails.
          FAKE="$RUNNER_TEMP/fake-daemon"
          mkdir -p "$FAKE/pilot_fake"
          printf '[project]\nname = "pilot-daemon"\nversion = "99.0.0"\n[tool.setuptools]\npackages = ["pilot_fake"]\n' > "$FAKE/pyproject.toml"
          touch "$FAKE/pilot_fake/__init__.py"
          before=$("$PY" -m pip freeze --disable-pip-version-check | sort | md5sum 2>/dev/null || "$PY" -m pip freeze | sort | md5)
          python tauri-app/src-tauri/setup/update.py apply --env "$ENV" --version 99.0.0 --source "$FAKE" | grep "^@@"
          status=${PIPESTATUS[0]}
          after=$("$PY" -m pip freeze --disable-pip-version-check | sort | md5sum 2>/dev/null || "$PY" -m pip freeze | sort | md5)
          version=$("$PY" -c "import importlib.metadata as m, pilot.server; print(m.version('pilot-daemon'))")
          echo "exit $status; installed after: $version; packages unchanged: $([ "$before" = "$after" ] && echo yes || echo no)"
          [ $status -ne 0 ] && [ "$version" = "0.15.0" ] && [ "$before" = "$after" ] && [ ! -e "$ENV.previous" ]

      - name: Plan and apply the update to this checkout
        run: |
          set +e
          ENV="$RUNNER_TEMP/home/.config/heliox-os/env"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' tauri-app/src-tauri/Cargo.toml | head -1)
          python tauri-app/src-tauri/setup/update.py plan --env "$ENV" --version "$VERSION" --source "$GITHUB_WORKSPACE/daemon" | grep "^@@"
          start=$(date +%s)
          python tauri-app/src-tauri/setup/update.py apply --env "$ENV" --version "$VERSION" --source "$GITHUB_WORKSPACE/daemon" --groups-file "$RUNNER_TEMP/setup.json" | tee "$RUNNER_TEMP/update.log" | grep "^@@"
          status=${PIPESTATUS[0]}
          echo "update exit code $status after $(( $(date +%s) - start )) s"
          cat "$RUNNER_TEMP/setup.json" 2>/dev/null
          exit $status

      - name: The updated daemon answers
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          ENV="$HOME/.config/heliox-os/env"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$ENV/Scripts/python.exe"; else PY="$ENV/bin/python"; fi
          "$PY" -c "import importlib.metadata as m; print('installed', m.version('pilot-daemon'))"
          "$PY" -m pilot.server > "$RUNNER_TEMP/daemon.log" 2>&1 &
          "$PY" daemon/tests/platform_real/first_run_rpc_check.py 240
          status=$?
          if [ $status -ne 0 ]; then tail -60 "$RUNNER_TEMP/daemon.log"; fi
          exit $status

  # ── Real setup, repair, credential store and removal (experimental, non-blocking) ──
  # The desktop app's own Rust code, without a window, in the runner's real home folder: the first run (setup.rs),
  # the repair after the environment's interpreter is deleted, then daemon/tests/platform_real/real_removal.sh: the
  # daemon's credential cleanup against the system's real credential store (one test entry per Heliox service,
  # checked with cmdkey, security or secret-tool), and "Remove Heliox's files" (uninstall.rs) in both modes, with
  # what is left in the home folder listed. The ignored Rust tests run only under GitHub Actions. The app's window
  # and its buttons are not used here.
  real-removal:
    name: Real setup, repair and removal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux dependencies (the app's libraries, a GNOME keyring and secret-tool)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libayatana-appindicator3-dev gnome-keyring libsecret-tools dbus dbus-x11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Build frontend (Tauri embeds it)
        working-directory: tauri-app/ui
        run: npm ci && npx vite build

      - name: Build the app's tests
        working-directory: tauri-app/src-tauri
        run: cargo test --all-targets --no-run

      - name: Paths, and keyring for the runner's own Python
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off keyring
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ENVPY=$HOME/.config/heliox-os/env/Scripts/python.exe" >> "$GITHUB_ENV"
            echo "HELIOX_DAEMON_SOURCE=$(cygpath -w "$GITHUB_WORKSPACE/daemon")" >> "$GITHUB_ENV"
          else
            echo "ENVPY=$HOME/.config/heliox-os/env/bin/python" >> "$GITHUB_ENV"
            echo "HELIOX_DAEMON_SOURCE=$GITHUB_WORKSPACE/daemon" >> "$GITHUB_ENV"
          fi
          echo "SYSPY=$(command -v python)" >> "$GITHUB_ENV"
          python daemon/tests/platform_real/home_snapshot.py save "$RUNNER_TEMP/home-before.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python daemon/tests/platform_real/windows_autostart_check.py save "$RUNNER_TEMP/autostart-before.json"
          fi

      - name: First run through the app's own setup code
        working-directory: tauri-app/src-tauri
        run: |
          HELIOX_REAL_SETUP=1 cargo test --all-targets -- --ignored --exact \
            setup::tests::real_first_run_installs_through_the_apps_code --nocapture

      - name: The daemon it installed answers, and is stopped
        run: |
          set +e
          "$ENVPY" -m pilot.server > "$RUNNER_TEMP/daemon.log" 2>&1 &
          "$ENVPY" daemon/tests/platform_real/first_run_rpc_check.py 240
          status=$?
          if [ $status -ne 0 ]; then tail -60 "$RUNNER_TEMP/daemon.log"; fi
          pkill -f "pilot.server" 2>/dev/null || taskkill //F //IM python.exe >/dev/null 2>&1 || true
          sleep 3
          exit $status

      # The supervisor loop of the app (supervisor::tick) with a real daemon: a crash, a second crash (the back-off
      # doubles) and a hang (the process suspended), with short limits; startup_status read from Rust says what
      # happened. Under a complete fake home of its own; the cargo and rustup folders stay the runner's.
      - name: The app's supervisor restarts a real daemon after a crash and after a hang
        continue-on-error: true
        working-directory: tauri-app/src-tauri
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HELIOX_REAL_SUPERVISOR_PYTHON="$ENVPY"
          export HOME="$RUNNER_TEMP/supervisor" USERPROFILE="$RUNNER_TEMP/supervisor"
          mkdir -p "$HOME"
          export LOCALAPPDATA="$HOME/AppData/Local" PYTHON_KEYRING_BACKEND=keyring.backends.fail.Keyring
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          if [ "$RUNNER_OS" = "Linux" ]; then
            export XDG_RUNTIME_DIR="$HOME/.runtime"
            mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          else
            unset XDG_RUNTIME_DIR
          fi
          cargo test --all-targets -- --ignored --exact \
            real_supervision::real_supervisor_restarts_a_crashed_and_a_hung_daemon --nocapture

      - name: Windows - after setup, nothing of Heliox starts by itself
        if: runner.os == 'Windows'
        run: python daemon/tests/platform_real/windows_autostart_check.py left "$RUNNER_TEMP/autostart-before.json"

      - name: Repair through the app's own code - the environment's interpreter is gone
        working-directory: tauri-app/src-tauri
        run: |
          "$SYSPY" "$GITHUB_WORKSPACE/daemon/tests/platform_real/repair_data_check.py" before "$RUNNER_TEMP/repair-data.json"
          rm -f "$ENVPY"
          HELIOX_REAL_SETUP=1 cargo test --all-targets -- --ignored --exact \
            setup::tests::real_repair_through_the_apps_code --nocapture
          status=$?
          "$SYSPY" "$GITHUB_WORKSPACE/daemon/tests/platform_real/repair_data_check.py" after "$RUNNER_TEMP/repair-data.json"
          exit $(( status + $? ))

      - name: Credential store and removal, for real
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- sh daemon/tests/platform_real/with_keyring.sh bash daemon/tests/platform_real/real_removal.sh
          else
            bash daemon/tests/platform_real/real_removal.sh
          fi

      - name: Windows - nothing of Heliox starts by itself, and the probe skips the Store's stub
        if: always() && runner.os == 'Windows'
        run: |
          set +e
          python daemon/tests/platform_real/windows_autostart_check.py left "$RUNNER_TEMP/autostart-before.json"
          left=$?
          python daemon/tests/platform_real/probe_check.py
          exit $(( left + $? ))

  # ── macOS type check of the desktop app (non-blocking) ──
  # The Rust job runs on Ubuntu and a Windows check is done locally; this compiles the app for macOS so a Mac-only
  # error is found here, not by someone building a release.
  rust-macos:
    name: Rust check (macOS)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-app/ui/package-lock.json

      - name: Build frontend (Tauri embeds it)
        working-directory: tauri-app/ui
        run: npm ci && npx vite build

      - name: Cargo check
        working-directory: tauri-app/src-tauri
        run: cargo check --all-targets

      # The whole suite on a Mac: the removal on APFS (app files go, data stays, a link out of Heliox's folders is
      # not followed), the per-user lock and the bring-forward port of instance.rs, and the rest.
      - name: Cargo tests
        working-directory: tauri-app/src-tauri
        run: cargo test --all-targets

  # ── Real faults on the runners (non-blocking) ──
  # Each step makes a fault happen for real on this machine and prints CHECK lines (daemon/tests/platform_real):
  # hard kills, two daemons at once, stop() with a request in flight, network faults in front of the real clients,
  # the update path against a port held by something else, and what "no NVIDIA card" claims. Every step starts from
  # an empty home with the keyring turned off, so nothing of the runner's own is touched.
  real-faults:
    name: Real faults (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the daemon (core only, as a first run does)
        run: python -m pip install --disable-pip-version-check --progress-bar off -e ./daemon

      - name: Hard kills (a worker's parent, a task in the middle)
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/kill" USERPROFILE="$RUNNER_TEMP/kill"
          mkdir -p "$HOME"
          # The rest of a fake home (pilot.real_folders): the per-user Windows folder, the XDG folders a runner image
          # may set, and the Linux runtime folder, none of which follow HOME. Without them a server built outside the
          # daemon is refused.
          export LOCALAPPDATA="$HOME/AppData/Local"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          if [ "$RUNNER_OS" = "Linux" ]; then export XDG_RUNTIME_DIR="$HOME/.runtime"; mkdir -p -m 700 "$XDG_RUNTIME_DIR"; fi
          python daemon/tests/platform_real/kill_checks.py

      - name: Two daemons started together
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/two" USERPROFILE="$RUNNER_TEMP/two"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/two_copies_check.py

      - name: Stop with a request in flight
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/stop" USERPROFILE="$RUNNER_TEMP/stop" LOCALAPPDATA="$RUNNER_TEMP/stop/AppData/Local"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/stop_timing_check.py

      - name: Network faults in front of the real clients
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/net" USERPROFILE="$RUNNER_TEMP/net" LOCALAPPDATA="$RUNNER_TEMP/net/AppData/Local"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/network_faults_check.py

      - name: The update path with the port held by something else
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/port" USERPROFILE="$RUNNER_TEMP/port" LOCALAPPDATA="$RUNNER_TEMP/port/AppData/Local"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/foreign_port_check.py

      - name: What "no NVIDIA card" claims, on a machine without one
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/gpu" USERPROFILE="$RUNNER_TEMP/gpu" LOCALAPPDATA="$RUNNER_TEMP/gpu/AppData/Local"
          mkdir -p "$HOME"
          python -m pilot.server > "$RUNNER_TEMP/gpu-daemon.log" 2>&1 &
          python daemon/tests/platform_real/first_run_rpc_check.py 240 && python daemon/tests/platform_real/model_health_check.py
          status=$?
          python -c "import asyncio, sys; sys.path.insert(0, 'daemon/tests/platform_real'); import stop_timing_check as s; asyncio.run(s.send('daemon_stop', {}, wait=True))" || true
          exit $status

      - name: The learner's saved state after the runtime folder is emptied (a reboot), and an earlier key moved
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/learner" USERPROFILE="$RUNNER_TEMP/learner" LOCALAPPDATA="$RUNNER_TEMP/learner/AppData/Local"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/learner_key_reboot_check.py

      - name: The last run, killed then stopped cleanly (startup_status says the unclean end once, the clean one never)
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/runrecord" USERPROFILE="$RUNNER_TEMP/runrecord" LOCALAPPDATA="$RUNNER_TEMP/runrecord/AppData/Local"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/run_record_check.py

      - name: A full disk and a read-only data folder (tmpfs and an ext4 image)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/disk"
          mkdir -p "$HOME"
          python daemon/tests/platform_real/storage_faults_check.py

      - name: A locked keychain (one made for the check; the login keychain is not touched)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.macOS.Keyring
        run: python daemon/tests/platform_real/keychain_locked_check.py
