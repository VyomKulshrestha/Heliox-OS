name: "Conversation Bench — timing (synthetic voice, CPU only)"

# The Conversation Bench's timing lines on a quiet, CPU-only machine with no audio device: a real kind of person
# Heliox is for. Synthetic voices only (no recording of a real person is ever needed or uploaded); every number is
# labelled "synthetic voice, GitHub runner (N cores), CPU only". Not run on pushes and never blocks anything.

on:
  workflow_dispatch:
    inputs:
      settings:
        description: 'Settings to compare inside this job, for example "parakeet_threads=2,3,4" (empty: the usual run)'
        required: false
        default: ""
      repeats:
        description: "Repeats of every setting (0: 3 when comparing, 1 otherwise)"
        required: false
        default: "0"
      only:
        description: "Scenario id fragments, comma-separated (empty: the ones the compared setting can move, or all)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: conversation-timing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  timing:
    name: Timing lines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # ubuntu first; macOS and Windows join once the ubuntu run is known to work.
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: daemon
        shell: bash
    env:
      # Every Heliox folder of the prefetch and the timing run (pilot.real_folders.use_scratch_folders); its
      # .local/share/heliox-os/models part is cached. Never the runner's own folders.
      HELIOX_BENCH_ROOT: ${{ github.workspace }}/.heliox-bench
      BENCH_AUDIO: ${{ github.workspace }}/.bench-audio # synthetic speech rendered by the bench, cached
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: System libraries (PortAudio for the audio package import, espeak-ng for the voice)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1 espeak-ng

      - name: Install the daemon with the voice extras (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[voice]" psutil

      # Restored here and saved right after fetching and rendering, before the long timing step: a timing run that
      # is stopped or fails (run 43290465258 hit the job's limit) must not cost the next run a full fetch.
      - name: Restore speech models
        id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/.heliox-bench/.local/share/heliox-os/models
            ~/.cache/huggingface
          key: speech-${{ runner.os }}-${{ hashFiles('daemon/pilot/system/speech_models.json', 'daemon/benchmarks/conversation_bench/ci_prefetch.py') }}

      - name: Restore rendered synthetic speech
        id: audio-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.bench-audio
          key: bench-audio-${{ runner.os }}-${{ hashFiles('daemon/benchmarks/conversation_bench/scenarios/*.json', 'daemon/benchmarks/conversation_bench/synth.py') }}

      - name: Fetch the speech set through Heliox's own download path
        env:
          HF_HUB_OFFLINE: "0"
        run: python -m benchmarks.conversation_bench.ci_prefetch --summary "$GITHUB_STEP_SUMMARY"

      - name: Render the synthetic-voice scenarios with the bench's renderer
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m benchmarks.conversation_bench.synth --audio "$BENCH_AUDIO" --only scenarios

      - name: Save speech models
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/.heliox-bench/.local/share/heliox-os/models
            ~/.cache/huggingface
          key: ${{ steps.models-cache.outputs.cache-primary-key }}

      - name: Save rendered synthetic speech
        if: steps.audio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.bench-audio
          key: ${{ steps.audio-cache.outputs.cache-primary-key }}

      - name: Timing lines (load-checked before every scenario)
        # Below the job's 150 minutes, so the summary, the timelines and the caches are still handled when it stops.
        # ci_timing refuses a comparison whose estimate does not fit in 90 % of this limit (LIMIT_MINUTES).
        timeout-minutes: 125
        env:
          LIMIT_MINUTES: "125"
          HF_HUB_OFFLINE: "1"
          # The two inputs go through the environment, never pasted into the command: they are typed text. On
          # the weekly schedule both are empty and the run is the usual one.
          COMPARE_SETTINGS: ${{ inputs.settings }}
          COMPARE_REPEATS: ${{ inputs.repeats || '0' }}
          COMPARE_ONLY: ${{ inputs.only }}
        run: >-
          python -m benchmarks.conversation_bench.ci_timing --audio "$BENCH_AUDIO"
          --results "$RUNNER_TEMP/conversation-timing" --limit-minutes "$LIMIT_MINUTES"
          --settings "$COMPARE_SETTINGS" --repeats "${COMPARE_REPEATS:-0}" --only "$COMPARE_ONLY"

      # The summary is written after every repeat, so a stopped run still reports the repeats it finished.
      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/conversation-timing/summary.md" ]; then
            cat "$RUNNER_TEMP/conversation-timing/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The timing step wrote no summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A real daemon stopped and killed while its Kokoro worker loads and while it is idle: how long the worker
      # outlives the daemon (it has no parent watch; it ends when its stdin closes). Uses the models fetched above.
      - name: The voice worker after a stop and after a hard kill
        continue-on-error: true
        timeout-minutes: 10  # about three times what it needs; the check has its own limit inside
        env:
          HF_HUB_OFFLINE: "1"
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: python tests/platform_real/voice_worker_stop_check.py

      # Report only: the local voice on this 4-core CPU. Making fixed sentences ahead beside the recognisers, the time
      # per piece, the voice worker's reload split twice three minutes apart, and which voice speaks a reply asked for
      # while the worker is released. The script moves every Heliox folder under HELIOX_BENCH_ROOT itself
      # (use_scratch_folders), where the models fetched above are; it plays nothing and fetches nothing. About five
      # minutes; runs whatever the timing step did, and never fails the job.
      - name: The local voice on this runner (report only)
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        env:
          HF_HUB_OFFLINE: "1"
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          failed=0
          for path in tests/platform_real/voice_make_ahead_check.py scripts/measure_kokoro_startup.py pilot/system/fixed_speech.py; do
            if [ -f "$path" ]; then
              echo "CHECK job-inputs/path: PASS - $path"
            else
              echo "CHECK job-inputs/path: FAIL - $path is missing"
              failed=$((failed + 1))
            fi
          done
          if [ -d "$BENCH_AUDIO/synthetic" ]; then
            echo "CHECK job-inputs/audio: PASS - $BENCH_AUDIO/synthetic"
          else
            echo "CHECK job-inputs/audio: FAIL - no rendered synthetic speech under $BENCH_AUDIO"
            failed=$((failed + 1))
          fi
          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi
          python tests/platform_real/voice_make_ahead_check.py --audio "$BENCH_AUDIO" --gap 180 --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload timelines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-timing-${{ matrix.os }}
          path: ${{ runner.temp }}/conversation-timing
          if-no-files-found: warn
          retention-days: 30
